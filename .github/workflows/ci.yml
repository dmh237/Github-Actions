# Nombre del workflow que se muestra en la interfaz de GitHub Actions
name: CI

# Eventos que activan el workflow: push y pull_request sobre la rama principal
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ------------------------------------------------------------------
  # Job 1: Integración continua básica
  # Realiza el checkout, configura Node.js, instala dependencias y
  # ejecuta pruebas sin fallar si el proyecto aún no las tiene.
  # ------------------------------------------------------------------
  build-and-test:
    # Sistema operativo sobre el que corre el job
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Descargar el código del repositorio en el runner
      - name: Checkout del código
        uses: actions/checkout@v4

      # Paso 2: Instalar Node.js LTS 20 y cachear dependencias de npm
      - name: Configurar entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Cachea node_modules entre ejecuciones para acelerar la CI
          cache: 'npm'

      # Paso 3: Instalar dependencias solo si existe package.json
      - name: Instalar dependencias
        run: |
          if [ -f package.json ]; then
            echo "package.json encontrado. Instalando dependencias..."
            npm ci
          else
            echo "No se encontró package.json. Se omite la instalación de dependencias."
          fi

      # Paso 4: Ejecutar pruebas sin fallar si aún no hay tests definidos
      - name: Ejecutar pruebas
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then
            echo "Ejecutando tests..."
            npm test
          else
            echo "No hay tests definidos aún. Este paso no falla."
          fi

  # ------------------------------------------------------------------
  # Job 2: Validación de mensajes de commit
  # Verifica que todos los commits cumplan con Conventional Commits
  # usando la configuración definida en commitlint.config.js.
  # ------------------------------------------------------------------
  commitlint:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Descargar el historial completo de commits (fetch-depth: 0)
      # commitlint necesita todo el historial para poder validar los mensajes
      - name: Checkout del código con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Paso 2: Validar los mensajes de commit con commitlint
      - name: Validar mensajes de commit
        uses: wagoid/commitlint-github-action@v6
        with:
          # Ruta al archivo de configuración de commitlint
          configFile: commitlint.config.js
